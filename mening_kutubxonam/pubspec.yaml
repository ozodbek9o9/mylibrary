publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  mobile_scanner: ^7.4.0
  intl: ^0.20.3
  connectivity_plus: ^7.3.1

dev_dependencies:
